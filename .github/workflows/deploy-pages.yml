name: Publish the site to the gh-pages branch

on:
  push:
    branches:
      - main
      - claude/website-deployment-rg4fau
  workflow_dispatch:

permissions:
  contents: write

# Let one publish finish before the next starts, and never cancel a run
# that is already pushing.
concurrency:
  group: publish-site
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          # A shallow clone cannot be pushed elsewhere: git rejects it with
          # "shallow update not allowed".
          fetch-depth: 0

      - name: Mirror this branch onto gh-pages
        # Pages serves the root of the gh-pages branch. The site is plain
        # static files already sitting at the repository root, so gh-pages is
        # just a mirror of this branch: nothing to build, nothing to strip.
        # Pushing with GITHUB_TOKEN does not retrigger this workflow, so there
        # is no loop.
        run: git push --force origin "HEAD:refs/heads/gh-pages"
