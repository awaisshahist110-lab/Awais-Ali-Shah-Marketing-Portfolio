name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/website-deployment-rg4fau
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let one deployment finish before the next starts, and never cancel a
# run that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Configure Pages
        # Pages must already be switched on for this repository with
        # Settings, Pages, Source: GitHub Actions. This step cannot switch it
        # on itself: creating a Pages site needs repository admin rights, and
        # the Actions token is never granted those.
        uses: actions/configure-pages@v5

      - name: Upload the site as a Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # The site is plain static HTML at the repository root.
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
